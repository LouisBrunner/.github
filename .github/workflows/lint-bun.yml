# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint Bun

on:
  workflow_call:
    inputs:
      bun-version:
        description: "Bun version to use"
        type: string
        default: ""
      run:
        description: "Lint command to run (empty = default: bun run lint:ci)."
        type: string
        default: ""
      setup:
        description: "Command to run before linting (empty = skip)."
        type: string
        default: ""

permissions: {}

jobs:
  lint:
    name: Vet
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: LouisBrunner/.github/.github/actions/setup-bun@main
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Install dependencies
        run: bun install

      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Setup
        if: ${{ inputs.setup != '' }}
        shell: bash
        env:
          CUSTOM_SETUP: ${{ inputs.setup }}
        run: |
          # FIXME: eval... need to be careful with those
          eval "$CUSTOM_SETUP"

      - name: Vet
        shell: bash
        env:
          CUSTOM_RUN: ${{ inputs.run }}
        run: |
          if [ -n "$CUSTOM_RUN" ]; then
            # FIXME: eval... need to be careful with those
            eval "$CUSTOM_RUN"
          else
            bun run vet:ci
          fi
