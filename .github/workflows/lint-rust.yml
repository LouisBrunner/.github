# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint Rust

on:
  workflow_call:
    inputs:
      toolchain:
        description: "Rust toolchain to use (e.g. 'stable', 'nightly', '1.80.0')"
        type: string
        default: "stable"
      working-directory:
        description: "Directory containing the crate to lint (default: repo root)"
        type: string
        default: "."
      run:
        description: "Lint command to run (empty = default: cargo fmt --check + cargo clippy)."
        type: string
        default: ""
      setup:
        description: "Command to run before linting (empty = skip)."
        type: string
        default: ""

permissions: {}

jobs:
  lint:
    name: Vet
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # no tags
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rustfmt, clippy

      - name: Set up cargo-audit
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-audit@0.22.2

      - name: Setup
        if: ${{ inputs.setup != '' }}
        shell: bash
        env:
          CUSTOM_SETUP: ${{ inputs.setup }}
        run: |
          # FIXME: eval... need to be careful with those
          eval "$CUSTOM_SETUP"

      - name: Audit dependencies
        shell: bash
        run: cargo audit

      - name: Vet
        shell: bash
        env:
          CUSTOM_RUN: ${{ inputs.run }}
        run: |
          if [ -n "$CUSTOM_RUN" ]; then
            # FIXME: eval... need to be careful with those
            eval "$CUSTOM_RUN"
          else
            cargo fmt --check
            cargo clippy -- -D warnings
          fi
