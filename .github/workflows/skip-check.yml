# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Skip check

on:
  workflow_call:
    inputs:
      paths:
        description: 'JSON array of path globs to watch (e.g. ''["**/*.go"]'').'
        type: string
        required: true
      do-not-skip:
        description: "JSON array of event names that must never be skipped."
        type: string
        default: '["workflow_dispatch"]'
    outputs:
      should_skip:
        description: "'true' if this run is a duplicate and should be skipped."
        value: ${{ jobs.pre.outputs.should_skip }}

permissions: {}

jobs:
  pre:
    name: Check for changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - name: Check for duplicate runs
        id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          paths: ${{ inputs.paths }}
          do_not_skip: ${{ inputs.do-not-skip }}
