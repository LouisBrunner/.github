# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint Biome

on:
  workflow_call:
    inputs:
      path:
        description: "Path to lint (default: entire repo)"
        type: string
        default: "."
      version:
        description: "Biome version to use"
        type: string
        default: "2.5.0"

permissions: {}

jobs:
  lint:
    name: Biome
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: ${{ inputs.version }}

      - name: Check for files
        id: has-files
        shell: bash
        env:
          INPUT_PATH: ${{ inputs.path }}
        run: |
          FILES=$(git ls-files "$INPUT_PATH" | grep -E '\.(jsonc?|[mc]?[tj]sx?|s?[ca]ss|html)$' | head -1 || true)
          echo "found=$([ -n "$FILES" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Check for package.json
        id: has-package
        if: ${{ steps.has-files.outputs.found == 'true' }}
        shell: bash
        env:
          INPUT_PATH: ${{ inputs.path }}
        run: |
          echo "found=$([ -f "$INPUT_PATH/package.json" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        if: ${{ steps.has-package.outputs.found == 'true' }}
        uses: LouisBrunner/.github/.github/actions/setup-bun@main

      - name: Install dependencies
        if: ${{ steps.has-package.outputs.found == 'true' }}
        shell: bash
        env:
          INPUT_PATH: ${{ inputs.path }}
        run: bun install --cwd "$INPUT_PATH"

      - name: Lint and format
        if: ${{ steps.has-files.outputs.found == 'true' }}
        env:
          INPUT_PATH: ${{ inputs.path }}
        run: biome ci "$INPUT_PATH"
